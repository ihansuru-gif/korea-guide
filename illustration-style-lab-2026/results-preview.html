<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일러스트 스타일 결과 방향 14종</title><style>
:root{--bg:#0a101b;--panel:#151e2e;--line:#2b3850;--text:#f3f6fb;--muted:#a9b4c7;--cyan:#74d7ff;--violet:#a99bff}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 80% 0,rgba(169,155,255,.15),transparent 30%),var(--bg);color:var(--text)}main{max-width:1120px;margin:auto;padding:52px 18px 70px}.eyebrow{font-size:12px;letter-spacing:.17em;color:var(--cyan);font-weight:800}h1{font-size:48px;line-height:1.1;letter-spacing:-.04em;margin:12px 0}header p{color:var(--muted);font-size:17px;line-height:1.7;max-width:760px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:30px}.card{background:linear-gradient(180deg,#172132,#111927);border:1px solid var(--line);border-radius:22px;padding:22px}.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07101c;font-weight:900}.card h2{font-size:22px;margin:15px 0 8px}.card p{color:#b6c3d5;line-height:1.65;margin:0}.card b{color:#fff}.note{margin-top:24px;padding:18px;border:1px solid var(--line);background:#111927;border-radius:18px;color:#cbd6e5;line-height:1.7}.back{display:inline-flex;margin-top:24px;padding:12px 16px;border-radius:13px;background:#1a2537;border:1px solid var(--line);color:#fff;text-decoration:none;font-weight:800}@media(max-width:720px){h1{font-size:36px}.grid{grid-template-columns:1fr}}</style></head><body><main><header><div class="eyebrow">TEACHER PREVIEW</div><h1>“나는 무엇에 매력을 느끼는가” 결과 방향 14종</h1><p>학생에게 한 직업이나 한 화풍을 지정하지 않습니다. 가장 강한 방향 1개와 함께 나타난 방향 2개를 조합해 보여주고, 실제 경험과의 차이를 따로 분석합니다.</p><a class="back" href="index.html">학생용 테스트로 돌아가기</a></header><section class="grid" id="grid"></section><div class="note"><b>예시</b><br>선 1순위, 편집 2순위, 그래픽 디자인 3순위라면 <b>“선의 생동감을 살리고, 최종 화면에서 크롭·타이포·색보정으로 인상을 정리하는 방향”</b>으로 설명합니다.</div></main><script>
const rows=[
['선','선의 굵기, 속도, 끊김과 압력에서 감정과 리듬을 읽습니다.'],['형태·실루엣','세부보다 비율, 덩어리와 멀리서 읽히는 형태를 먼저 봅니다.'],['캐릭터 인상','얼굴, 표정, 의상과 헤어가 캐릭터의 매력을 만든다고 느낍니다.'],['색 조합','채도, 온도, 제한 팔레트와 색 사이의 관계에 민감합니다.'],['채색·렌더링','평면색, 명암과 재질이 쌓이며 화면이 완성되는 과정에 끌립니다.'],['빛·분위기','역광, 환경광, 시간대와 색광이 장면의 감정을 바꾸는 부분을 봅니다.'],['질감·재질','붓결, 노이즈와 피부·천·금속·유리의 표면 차이에 시선이 머뭅니다.'],['구도·카메라','인물의 위치, 여백, 크롭과 시점이 화면의 힘을 만든다고 봅니다.'],['배경·세계관','장소의 구조, 공기와 시간대가 인물의 이야기를 확장한다고 느낍니다.'],['오브젝트·소품','사물의 모양, 배치와 상징이 캐릭터와 장면을 설명하는 방식에 끌립니다.'],['그래픽 디자인','타이포, 패턴, 도형과 이미지가 함께 설계된 화면에 매력을 느낍니다.'],['편집·후보정','크롭, 여백, 색보정과 효과로 최종 인상을 정리하는 과정에 만족을 느낍니다.'],['서사·감정','인물 관계, 사건의 전후와 감정이 읽히는 장면에 끌립니다.'],['컨셉·개성','인외, 오브젝트 헤드와 낯선 비율처럼 독특한 규칙을 가진 그림을 좋아합니다.']];document.getElementById('grid').innerHTML=rows.map((r,i)=>`<article class="card"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>나는 <b>${r[0]}</b>에 매력을 느낍니다</h2><p>${r[1]}</p></article>`).join('');
</script></body></html>
