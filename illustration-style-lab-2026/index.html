<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a101b"><meta name="description" content="이미지 없이 선, 채색, 색, 디자인, 편집, 배경, 서사 등 일러스트 선호 요소를 깊게 탐색하는 수업용 테스트"><title>내가 선호하는 일러스트 스타일은?</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#0a101b,#101a2a);color:#f3f6fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;display:grid;place-items:center;min-height:100vh}.load{width:min(520px,calc(100% - 32px));padding:26px;border:1px solid #2b3850;border-radius:20px;background:#151e2e;box-shadow:0 24px 80px rgba(0,0,0,.28);line-height:1.75}.load b{display:block;font-size:20px;margin-bottom:4px}.bar{height:8px;background:#222e43;border-radius:999px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:48%;background:linear-gradient(90deg,#6fd3ff,#a995ff);border-radius:999px;animation:move 1.2s infinite ease-in-out}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(220%)}}</style></head><body><div class="load"><b>테스트를 불러오는 중입니다</b>선, 채색, 디자인, 편집과 작업 경험을 확인할 준비를 하고 있습니다.<div class="bar"><i></i></div></div><script>(async()=>{try{const files=['v5/payload-00.part','v5/payload-01.part','v5/payload-02.part','v5/payload-03.part'];const b64=(await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})))).join('');const u=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('unsupported');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>사이트를 불러오지 못했습니다</b>브라우저를 새로고침해 주세요. 문제가 계속되면 최신 Chrome 또는 Edge에서 열어 주세요.</div>';console.error(e)}})();</script></body></html>
