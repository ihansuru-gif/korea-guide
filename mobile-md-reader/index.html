<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>MD Pocket Reader</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Markdown / TXT</p>
        <h1>MD Pocket Reader</h1>
      </div>
      <div class="top-actions">
        <button id="repoToggle" class="ghost-button" type="button">Repo</button>
        <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">T</button>
      </div>
    </header>

    <main class="workspace">
      <section id="repoPanel" class="repo-panel" hidden>
        <div class="repo-head">
          <div>
            <strong>Repo library</strong>
            <span id="repoCount">Checking...</span>
          </div>
          <button id="repoOpenAll" class="solid-button" type="button" hidden>Open all</button>
        </div>
        <div class="repo-uploader">
          <input id="repoToken" type="password" autocomplete="off" placeholder="GitHub token for upload">
          <input id="repoUploadInput" class="file-input" type="file" multiple>
          <button id="repoPickFiles" class="ghost-button" type="button">Choose</button>
          <button id="repoUploadButton" class="solid-button" type="button">Upload</button>
        </div>
        <p id="repoUploadStatus" class="hint" role="status"></p>
        <div id="repoList" class="repo-list"></div>
      </section>

      <section id="emptyState" class="empty-state">
        <div class="drop-zone" id="dropZone">
          <input id="fileInput" class="file-input" type="file" multiple>
          <label for="fileInput" class="primary-action">Open file</label>
          <p>Read and edit .md / .txt files from your phone.</p>
          <p class="hint">Files stay on this device.</p>
          <p id="openMessage" class="hint" role="status"></p>
        </div>
      </section>

      <section id="readerPanel" class="reader-panel" hidden>
        <div class="file-strip">
          <button id="openFileButton" class="ghost-button" type="button">Open</button>
          <div class="file-meta">
            <strong id="fileName">untitled.md</strong>
            <span id="saveStatus">Ready</span>
          </div>
          <button id="saveButton" class="solid-button" type="button">Save</button>
        </div>

        <div class="controls">
          <div class="segmented" role="tablist" aria-label="View mode">
            <button id="previewTab" class="segment active" type="button">Read</button>
            <button id="editTab" class="segment" type="button">Edit</button>
            <button id="splitTab" class="segment" type="button">Split</button>
            <button id="allTab" class="segment" type="button">All</button>
          </div>
          <label class="search-box">
            <span>Find</span>
            <input id="searchInput" type="search" placeholder="Search text">
          </label>
          <label class="size-control">
            <span>Size</span>
            <input id="fontSize" type="range" min="15" max="24" value="18">
          </label>
        </div>

        <div id="fileList" class="file-list" hidden></div>

        <div id="contentArea" class="content-area preview-mode">
          <article id="preview" class="markdown-view"></article>
          <article id="allPreview" class="markdown-view all-view"></article>
          <textarea id="editor" class="editor" spellcheck="false" aria-label="Markdown editor"></textarea>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
